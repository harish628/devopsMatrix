name: DevOpsMatrix CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: static-site

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Authenticate to AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::840986438223:role/githubactionsRole
          aws-region: ${{ env.AWS_REGION }}

      # 3. Verify AWS authentication
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 4. Get AWS Account ID
      - name: Get AWS Account ID
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> $GITHUB_ENV

      # 5. Validate/Create ECR repository
      - name: Validate ECR repository
        run: |
          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" > /dev/null 2>&1
          then
            echo "ECR repository already exists"
          else
            echo "ECR repository does not exist. Creating..."
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION"
          fi

      # 6. Login to ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin \
              "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      # 7. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t "$ECR_REPOSITORY:${GITHUB_SHA}" \
            .

      # 8. Tag Docker image
      - name: Tag Docker image
        run: |
          docker tag \
            "$ECR_REPOSITORY:${GITHUB_SHA}" \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${GITHUB_SHA}"

      # 9. Push Docker image to ECR
      - name: Push Docker image
        run: |
          docker push \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${GITHUB_SHA}"